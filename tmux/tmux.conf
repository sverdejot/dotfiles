# ---------- terminal / colors ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on          # images / OSC sequences (Ghostty, kitty graphics)
set -g set-clipboard on
set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 50000

# ---------- prefix ----------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------- windows / panes ----------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind N new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind x kill-pane
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ---------- vim-tmux-navigator: Ctrl+Arrow smart pane switching ----------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-Left  if-shell "$is_vim" 'send-keys C-Left'  'select-pane -L'
bind -n C-Down  if-shell "$is_vim" 'send-keys C-Down'  'select-pane -D'
bind -n C-Up    if-shell "$is_vim" 'send-keys C-Up'    'select-pane -U'
bind -n C-Right if-shell "$is_vim" 'send-keys C-Right' 'select-pane -R'

# ---------- windows navigation ----------
# Ctrl+1..9 (sent by Ghostty as prefix+N) selects window N; see ghostty/config
bind Tab last-window
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window
bind z resize-pane -Z

# ---------- plugins ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
